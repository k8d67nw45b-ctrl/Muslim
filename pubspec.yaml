name: rafiq_almuslim
description: رفيق المسلم - تطبيق اسلامي متكامل
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_qiblah: ^3.1.0
  geolocator: ^13.0.2
  http: ^1.2.2
  flutter_local_notifications: ^17.2.4
  flutter_timezone: ^3.0.1
  timezone: ^0.9.4
  google_fonts: ^6.2.1
  photo_view: ^0.15.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
